[meta]
name = "pretix-ticketswap"
version = "2.0.0"
category = "INTEGRATION"
min_basever = "2024.7.0"

[author]
name = "Andre Vidal"
email = "andrei@hexadexa.dev"

[description]
short = "SecureSwap partner endpoints for Pretix"
long = """
Implements the TicketSwap SecureSwap secondary-ticketing specification.
Pretix exposes the partner-side endpoints (validate, swap, personalize,
events, tickets, lock, personalization-fields) and TicketSwap calls into
them via a Bearer-token-authenticated organizer-scoped URL.

Features:
- Full SecureSwap spec coverage (Validate / Swap / Personalize / Lock /
  Sealed Ticketing endpoints)
- Per-organizer partner token + per-event enable toggle
- Pretix-native PDF rendering with signed expiring URLs
- GDPR-compliant data shredder
- Multi-language support (EN, PT)

Requires a SecureSwap partnership with TicketSwap and a shared bearer token.
"""

